# BliKVM v4 / H616 / MS2131. M8-A local-only video profile.
kvmd:
    server:
        unix: /run/kvmd/api/kvmd.sock
        unix_mode: 0660
    auth:
        enabled: false
        internal:
            type: forbidden
    hid:
        type: disabled
    atx:
        type: disabled
    msd:
        type: disabled
    log_reader:
        enabled: false
    streamer:
        forever: true
        quality: 0
        desired_fps:
            default: 30
            min: 30
            max: 30
        resolution:
            default: 1920x1080
            available: [1920x1080]
        unix: /run/kvmd/ustreamer/ustreamer.sock
        cmd:
            - /usr/bin/ustreamer
            - --device=/dev/kvmd-video
            - --resolution={resolution}
            - --desired-fps={desired_fps}
            - --device-fps=30
            - --quality=0
            - --format=MJPEG
            - --encoder=HW
            - --unix={unix}
            - --unix-mode=0660
            - --unix-rm
            - --exit-on-parent-death
            - --notify-parent
            - --no-log-colors
